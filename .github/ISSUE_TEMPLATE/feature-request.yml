name: 功能请求
description: 为本 Fork 提议新功能。
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        本 Fork 只为单一服务器服务，范围有限。具有普遍价值的功能更适合向上游提议，以惠及更多人。

  - type: textarea
    attributes:
      label: 想要的功能
      description: 尽可能详细地描述你希望加入的功能。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 为何需要
      description: 为什么现有的功能不能满足需求。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 是否也适合上游
      description: 该功能是本 Fork 特有的需求，还是同样适合提交给上游？
    validations:
      required: false

name: 问题反馈
description: 本 Fork 的某项功能未按预期工作。
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        本仓库只受理 MINEZ Velocity Fork 的问题。

        提交前请先在未经修改的上游构建上复现：若上游同样存在该问题，请照常向上游反馈，不必也不要提及本 Fork。

  - type: textarea
    attributes:
      label: 预期行为
      description: 你期望发生什么。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 实际行为
      description: 实际发生了什么。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤
      description: 如何复现该问题，可以是文字说明、视频或你的 Velocity 配置。
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 上游构建上能否复现
      options:
        - 不能，仅在本 Fork 上出现
        - 尚未尝试
    validations:
      required: true

  - type: textarea
    attributes:
      label: Velocity 版本
      description: |
        执行 `/velocity info` 的完整输出，请粘贴文本而非截图。
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: 插件列表
      description: |
        代理端与相关后端服务器上的全部插件。
        代理端可用 `/velocity plugins` 列出，后端服务器可用 `/plugins` 列出。
    validations:
      required: false

  - type: textarea
    attributes:
      label: 其他信息
      description: 其他你认为有帮助的内容，例如相关日志。
    validations:
      required: false
